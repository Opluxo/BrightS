name: Build & Release

# BrightS is an arm64-only, from-scratch Linux distribution. Everything is
# built here from the versions pinned in versions.lock: the kernel, BusyBox,
# libdrm, the glibc runtime staged into /System/lib, the embedder test
# binaries, and the final cpio initramfs.
#
# See scripts/build.sh for the pipeline and scripts/boot-test.sh for the
# QEMU smoke test.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  arm64:
    name: arm64 (Image + initramfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            flex bison bc libssl-dev libelf-dev \
            cpio gzip xz-utils bzip2 curl file \
            meson ninja-build pkg-config \
            qemu-system-arm

      - name: Cache upstream source tarballs
        uses: actions/cache@v4
        with:
          path: build/dl
          key: brights-sources-${{ hashFiles('versions.lock') }}

      - name: Build
        run: ./scripts/build.sh all

      - name: Show artifacts
        run: ls -lh out/

      - name: Boot smoke test (QEMU)
        run: ./scripts/boot-test.sh 180

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: build/boot.log
          if-no-files-found: ignore

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: brights-arm64
          path: |
            out/Image
            out/initramfs.cpio.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [ arm64 ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brights-arm64
          path: release

      - name: Rename artifacts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd release
          mv Image "BrightS-${TAG}-arm64-Image"
          mv initramfs.cpio.gz "BrightS-${TAG}-arm64-initramfs.cpio.gz"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
